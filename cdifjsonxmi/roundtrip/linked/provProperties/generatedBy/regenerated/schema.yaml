'$schema': 'https://json-schema.org/draft/2020-12/schema'
title: >-
  very simple links or names of software or instruments used to generate a resource.
type: object
properties:
  '@type':
    type: array
    items:
      type: string
    contains:
      const: 'prov:Activity'
    minItems: 1
  'prov:used':
    type: array
    items:
      '$ref': '#/$defs/StringOrIdReferenceOrEntityOrOption4OrOption5OrOption6'
    description: >-
      Entities the activity used. Per PROV-O each value denotes a prov:Entity. An item may
      be (1) a string URI or free-text reference, (2) an {@id} reference, (3) an inline entity
      object carrying an @type that includes prov:Entity plus a schema.org type for the kind
      of thing used, e.g. ["prov:Entity","schema:Thing"] (instrument), ["prov:Entity","schema:CreativeWork"]
      (method/protocol), or ["prov:Entity","schema:SoftwareApplication"] (software), or (4)
      a role-keyed wrapper naming what was used through one of the recognized "used" relations
      (schema:instrument, bios:computationalTool, prov:reagent). Base leaves the wrapped value
      loose; profiles/extensions (e.g. cdifProvActivity, adaProduct) pin its shape (Instrument,
      ComputationalTool, Reagent, ...).
required:
- '@type'
'$defs':
  Entity:
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'prov:Entity'
        minItems: 1
    required:
    - '@type'
  StringOrIdReferenceOrEntityOrOption4OrOption5OrOption6:
    anyOf:
    - type: string
    - type: object
      required:
      - '@id'
      additionalProperties: false
      properties:
        '@id':
          type: string
          description: a resolvable reference to a representation of the software or instrument
            used
    - '$ref': '#/$defs/Entity'
      description: an inline prov:Entity used by the activity (see prov:used description)
    - '$ref': '#/$defs/StringOrIdReferenceOrEntityOrOption4OrOption5OrOption6Option4'
      description: >-
        a role-keyed wrapper naming an instrument used by the activity; the extension layer
        pins the value to an Instrument description.
    - '$ref': '#/$defs/StringOrIdReferenceOrEntityOrOption4OrOption5OrOption6Option5'
      description: >-
        a role-keyed wrapper naming a computational tool (software) used; the extension layer
        pins the value to a ComputationalTool description.
    - '$ref': '#/$defs/StringOrIdReferenceOrEntityOrOption4OrOption5OrOption6Option6'
      description: >-
        a role-keyed wrapper naming a reagent / material used; the extension layer pins the
        value to a Reagent description.
  StringOrIdReferenceOrEntityOrOption4OrOption5OrOption6Option4:
    type: object
    allOf:
    - required:
      - 'schema:instrument'
  StringOrIdReferenceOrEntityOrOption4OrOption5OrOption6Option5:
    type: object
    allOf:
    - required:
      - 'bios:computationalTool'
  StringOrIdReferenceOrEntityOrOption4OrOption5OrOption6Option6:
    type: object
    allOf:
    - required:
      - 'prov:reagent'
