'$schema': 'https://json-schema.org/draft/2020-12/schema'
type: object
properties:
  '@type':
    default:
    - 'schema:Organization'
    type: array
    items:
      type: string
      enum:
      - 'schema:Organization'
      - 'schema:FundingAgency'
      - 'schema:Consortium'
      - 'schema:Corporation'
      - 'schema:EducationalOrganization'
      - 'schema:FundingScheme'
      - 'schema:GovernmentOrganization'
      - 'schema:NGO'
      - 'schema:Project'
      - 'schema:ResearchOrganization'
    contains:
      const: 'schema:Organization'
    minItems: 1
  '@id':
    type: string
  'schema:additionalType':
    type: array
    items:
      '$ref': >-
        ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
  'schema:name':
    type: string
    description: string label for organization that is meaningful for human users
  'schema:alternateName':
    type: string
    description: other labels by which the organization might be known
  'schema:description':
    type: string
  'schema:identifier':
    anyOf:
    - '$ref': >-
        ../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/identifier/schema.yaml
    - type: string
    description: identifier for organization
  'schema:sameAs':
    type: array
    items:
      anyOf:
      - type: string
      - type: object
        additionalProperties: false
        required:
        - '@id'
        properties:
          '@id':
            type: string
    description: other identifiers for the organization
required:
- '@type'
allOf:
- anyOf:
  - required:
    - 'schema:name'
  - required:
    - 'schema:identifier'
