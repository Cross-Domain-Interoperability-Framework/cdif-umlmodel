'$schema': 'https://json-schema.org/draft/2020-12/schema'
description: |-
  A typed link, implemented as a schema.org LinkRole: schema:linkRelationship names how the target relates to the subject, and schema:target carries the EntryPoint actually being linked to.
  This is the right shape when the relationship itself is the point -- "this is the canonical version of", "this is the download endpoint for". Where the value is simply a work at a URL, such as a license or a terms-of-service document, use schemaorgProperties/labeledLink instead: a licence is a work, not a role, and wrapping it in a Role forces every consumer through an indirection to reach the thing itself.
  Defined here as a block rather than inline in a profile (where it lived until 2026-09-23) so that more than one consumer can reuse it. While it was inline in cdifCore, schemaorgProperties/instrument could not reach it and defined schema:relatedLink as a labeled link instead -- the same property carrying two different shapes depending on which node held it.
type: object
properties:
  '@type':
    default:
    - 'schema:LinkRole'
    type: array
    items:
      type: string
    contains:
      const: 'schema:LinkRole'
    minItems: 1
  'schema:linkRelationship':
    default: missing
    '$ref': >-
      ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
    description: >-
      How the target relates to the subject, as a controlled-vocabulary value or a plain string
      label. Required: a typed link whose relationship is unstated carries no more information
      than a bare URL, which is what schemaorgProperties/labeledLink is for.
  'schema:target':
    '$ref': '#/$defs/LinkRoleEntryPoint'
    description: >-
      The entry point being linked to. Deliberately not sealed: real targets also carry schema:httpMethod,
      schema:urlTemplate, schema:contentType and domain-specific properties, and JSON-LD is
      open-world.
required:
- '@type'
- 'schema:linkRelationship'
'$defs':
  LinkRoleEntryPoint:
    type: object
    properties:
      '@type':
        default:
        - 'schema:EntryPoint'
        type: array
        items:
          type: string
        contains:
          const: 'schema:EntryPoint'
        minItems: 1
      'schema:name':
        type: string
      'schema:url':
        type: string
        format: uri
      'schema:encodingFormat':
        type: string
        description: registered MIME types are expected
