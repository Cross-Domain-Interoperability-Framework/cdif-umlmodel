'$schema': 'https://json-schema.org/draft/2020-12/schema'
title: Optional XAS metadata fields
description: >-
  Genuinely-optional XAS properties layered on cdifCore. Adds no requirement to a record that
  carries no optional XAS content; a record that does carry schema:variableMeasured must declare
  conformance to https://w3id.org/cdif/xasOptional/1.0. Documents and permits optional XAS
  content: (a) XAS data-array variables as schema:variableMeasured cdi:InstanceVariable items,
  and (b) optional beamline-operational and sample physico-chemical parameters carried as
  schema:additionalProperty entries (on the prov:used NXinstrument entity and the schema:object
  sample respectively; see description.md for the propertyID vocabularies). Present only when
  the corresponding measurements exist.
type: object
properties:
  '@context':
    type: object
    description: JSON-LD prefixes used by optional XAS fields.
    properties:
      xas:
        const: 'https://w3id.org/cdif/xas/'
      nxs:
        const: 'https://manual.nexusformat.org/classes/'
  'schema:variableMeasured':
    type: array
    items:
      '$ref': >-
        ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifInstanceVariable/schema.yaml
    description: >-
      Optional XAS data-array variables (energy, i0, itrans, ifluor, irefer, mutrans, mufluor,
      murefer, normtrans, normfluor, normrefer, chi, chi_re, chi_im, chi_mag, chi_pha, k,
      r, angle), each a cdi:InstanceVariable / schema:PropertyValue. Not required. The XDI
      variable propertyID enum is layered on in xasCore; this profile only enforces the base
      cdifInstanceVariable shape.
  'prov:wasGeneratedBy':
    type: array
    items:
      properties:
        'schema:additionalProperty':
          description: >-
            XAS activity-level additionalProperty vocabulary. All entries resolve to SKOS
            concepts in the XAS-CDIF glossary.
          type: array
          items:
            allOf:
            - '$ref': >-
                ../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/additionalProperty/schema.yaml
            - properties:
                'schema:propertyID':
                  type: array
                  minItems: 1
                  items:
                    anyOf:
                    - '$ref': '../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/additionalProperty/schema.yaml#/$defs/propertyID_item'
                    - enum:
                      - 'xas:edgeenergy'
                      - 'xas:calibrationmethod'
                      - 'xas:experimentdocumentation'
                      - 'xas:installedoptions'
        'schema:object':
          description: >-
            Sample additionalProperty entries. XDI Sample.* vocabulary (XDI-CDIF-Mapping.xlsx
            rows 47-64) plus legacy xas:* names and NEXUS NXsample fields.
          properties:
            'schema:additionalProperty':
              type: array
              items:
                allOf:
                - '$ref': >-
                    ../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/additionalProperty/schema.yaml
                - properties:
                    'schema:propertyID':
                      type: array
                      minItems: 1
                      items:
                        anyOf:
                        - '$ref': '../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/additionalProperty/schema.yaml#/$defs/propertyID_item'
                        - enum:
                          - 'xas:concentration'
                          - 'xas:samplecrystalstructure'
                          - 'xas:density'
                          - 'xas:eh'
                          - 'xas:electricfield'
                          - 'xas:electrochemicalpotential'
                          - 'xas:magneticfield'
                          - 'xas:magneticmoment'
                          - 'xas:opacity'
                          - 'xas:parentsample'
                          - 'xas:ph'
                          - 'xas:porosity'
                          - 'xas:pressure'
                          - 'xas:resistivity'
                          - 'xas:samplechemicalcomposition'
                          - 'xas:samplematerial'
                          - 'xas:samplepreparation'
                          - 'nxs:base_classes/NXsample.html#nxsample-temperature-field'
                          - 'xas:temperature'
                          - 'xas:viscosity'
                          - 'xas:volume'
                          - 'nxs:Field/NXsample/mass'
                          - 'nxs:Field/NXsample/point_group'
                          - 'nxs:Field/NXsample/unit_cell'
        'prov:used':
          type: array
          items:
            if:
              description: >-
                When this peer prov:used entry's instrument is a beamline (schema:additionalType
                contains the NXinstrument class), its schema:additionalProperty entries SHOULD
                use the XDI Beamline vocabulary (XDI-CDIF-Mapping.xlsx rows 10-20, excluding
                Beamline.name which maps to schema:name).
              properties:
                'schema:instrument':
                  type: array
                  contains:
                    type: object
                    properties:
                      'schema:additionalType':
                        anyOf:
                        - type: object
                          additionalProperties: false
                          required:
                          - '@id'
                          properties:
                            '@id':
                              enum:
                              - 'nxs:base_classes/NXinstrument.html'
                              - 'xas:beamline'
                        - type: array
                          contains:
                            type: object
                            additionalProperties: false
                            required:
                            - '@id'
                            properties:
                              '@id':
                                enum:
                                - 'nxs:base_classes/NXinstrument.html'
                                - 'xas:beamline'
            then:
              properties:
                'schema:instrument':
                  type: array
                  contains:
                    type: object
                    properties:
                      'schema:additionalProperty':
                        type: array
                        items:
                          allOf:
                          - '$ref': >-
                              ../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/additionalProperty/schema.yaml
                          - properties:
                              'schema:propertyID':
                                type: array
                                minItems: 1
                                items:
                                  anyOf:
                                  - '$ref': '../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/additionalProperty/schema.yaml#/$defs/propertyID_item'
                                  - enum:
                                    - 'xas:collimation'
                                    - 'xas:detectortype'
                                    - 'xas:energyrange'
                                    - 'xas:energyresolution'
                                    - 'xas:flux'
                                    - 'xas:focusing'
                                    - 'xas:harmonicrejection'
                                    - 'xas:scanmode'
                                    - 'xas:spotsize'
                                    - 'xas:website'
    description: >-
      Optional-vocabulary layer on the XAS analysis activity. Adds propertyID enums for (a)
      activity-level additionalProperty entries, (b) the sample (schema:object) additionalProperty
      entries, and (c) the beamline peer instrument's additionalProperty entries. Enum arms
      are additive over the base propertyID_item shape.
