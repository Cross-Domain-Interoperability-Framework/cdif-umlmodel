'$schema': 'https://json-schema.org/draft/2020-12/schema'
title: CDIF Data Description properties
description: >-
  Additional constraints for CDIF data description level. Adds cdif:physicalDataType requirement
  on variableMeasured items and distribution-level cdi properties for file characterization
  (characterSet, fileSize, fileSizeUofM).
type: object
properties:
  '@context':
    type: object
    description: Additional JSON-LD namespace prefixes for discovery and data description.
    properties:
      geosparql:
        const: 'http://www.opengis.net/ont/geosparql#'
      dqv:
        const: 'http://www.w3.org/ns/dqv#'
      cdi:
        const: 'http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/'
  'cdif:hasPrimaryKey':
    anyOf:
    - '$ref': >-
        ../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifKey/schema.yaml
    - type: object
      required:
      - '@id'
      additionalProperties: false
      properties:
        '@id':
          type: string
      description: >-
        object reference via URI or URI fragment to a cdif:Key defined elsewhere in the same
        document
    description: >-
      Primary key of the dataset: a cdif:Key whose cdif:isComposedOf is an ordered list of
      cdi:InstanceVariables (from schema:variableMeasured) that uniquely identify each data
      instance.
  'cdif:statistics':
    type: array
    items:
      anyOf:
      - '$ref': >-
          ../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifStatistics/schema.yaml
      - type: object
        required:
        - '@id'
        additionalProperties: false
        properties:
          '@id':
            type: string
    description: |-
      **Dataset-scope** summary statistics — statistics that describe the dataset as a whole rather than any single variable (e.g. row count, dataset-wide totals, table-level checksums). Each entry is a cdi:Statistics bundle (one or more Statistic value objects) or a cdi:StatisticsCollection; inline or @id-reference to one declared elsewhere. cdif: namespaced — DDI-CDI has no `statistics` association from a dataset; this is a CDIF attachment property reserved for genuinely dataset-scope aggregates.
      Per-variable statistics MUST NOT appear here — they belong under `schema:variableMeasured[i].cdif:isDescribedBy_StatisticsCollection`, which is the direct JSON mapping of the DDI-CDI `InstanceVariable → isDescribedBy → StatisticsCollection` association. As a consequence, entries under `cdif:statistics` MUST NOT carry `cdif:appliesTo` (Statistics) or `cdif:indexedBy` (StatisticsCollection); those properties are the marker of a per-variable stat and require the variable-anchored path.
  'schema:variableMeasured':
    type: array
    items:
      '$ref': '#/$defs/DataDescriptionVariableMeasured'
  'schema:distribution':
    type: array
    items:
      allOf:
      - if:
          properties:
            '@type':
              contains:
                const: 'schema:DataDownload'
        then:
          properties:
            'cdif:hasPhysicalMapping':
              type: array
              description: >-
                Per-field physical mappings linking the variables measured by this DataDownload
                distribution to their physical representation in the file - column index,
                format, physical data type, null sequence, etc. Each item is a cdifPhysicalMapping
                or one of its specializations (cdifTextMapping for tabular text, cdifLocatorMapping
                for structured data); the dataset-type branches below tighten the item type.
              items:
                anyOf:
                - '$ref': >-
                    ../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifPhysicalMapping/schema.yaml
                - '$ref': >-
                    ../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifTextMapping/schema.yaml
                - '$ref': >-
                    ../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifLocatorMapping/schema.yaml
            'cdi:characterSet':
              type: string
              description: The character set used in the distribution (e.g., UTF-8, ASCII).
            'cdi:fingerprint':
              description: >-
                Integrity fingerprint (checksum/hash) of this distribution's bytes (DDI-CDI
                DataFingerprint).
              '$ref': >-
                ../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifDataFingerprint/schema.yaml
      - if:
          properties:
            '@type':
              contains:
                const: 'cdi:TabularTextDataSet'
        then:
          '$ref': >-
            ../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifTabularTextDataSet/schema.yaml
      - if:
          properties:
            '@type':
              contains:
                const: 'cdi:StructuredDataSet'
        then:
          '$ref': >-
            ../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifStructuredDataSet/schema.yaml
      - if:
          properties:
            '@type':
              contains:
                const: 'schema:WebAPI'
        then:
          properties:
            'schema:potentialAction':
              items:
                properties:
                  'schema:result':
                    properties:
                      'cdif:hasPhysicalMapping':
                        type: array
                        description: >-
                          Per-field physical mappings for the API response - the response
                          is another physical realization of the dataset's variables. Each
                          item is a cdifPhysicalMapping or one of its specializations (cdifTextMapping
                          / cdifLocatorMapping).
                        items:
                          anyOf:
                          - '$ref': >-
                              ../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifPhysicalMapping/schema.yaml
                          - '$ref': >-
                              ../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifTextMapping/schema.yaml
                          - '$ref': >-
                              ../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifLocatorMapping/schema.yaml
                      'cdi:characterSet':
                        type: string
                        description: The character set used in the API response (e.g., UTF-8).
    description: >-
      Each schema:DataDownload distribution item SHOULD additionally be typed as cdi:PhysicalDataSet
      or one of its subclasses (cdi:TabularTextDataSet, cdi:StructuredDataSet). schema:WebAPI
      distribution items do not require a cdi: dataset type. Not enforced at schema level
      (the merge with cdifCore and cdifManifest drops the @type constraint at profile resolution);
      consider a SHACL rule if runtime enforcement is needed.
required:
- 'schema:variableMeasured'
allOf:
- properties:
    'schema:subjectOf':
      properties:
        'dcterms:conformsTo':
          type: array
          items:
            type: object
            required:
            - '@id'
            additionalProperties: false
            properties:
              '@id':
                type: string
                description: uri for specifications that this metadata record conforms to
          minItems: 1
- if:
    required:
    - 'schema:variableMeasured'
    properties:
      'schema:variableMeasured':
        type: array
        minItems: 1
  then:
    required:
    - 'schema:subjectOf'
    properties:
      'schema:subjectOf':
        required:
        - 'dcterms:conformsTo'
        properties:
          'dcterms:conformsTo':
            contains:
              type: object
              required:
              - '@id'
              additionalProperties: false
              properties:
                '@id':
                  const: 'https://w3id.org/cdif/data_description/1.1'
'$defs':
  DataDescriptionVariableMeasured:
    allOf:
    - '$ref': >-
        ../../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/variableMeasured/schema.yaml
    - '$ref': >-
        ../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifInstanceVariable/schema.yaml
    - type: object
      description: >-
        At the Data Description profile level, InstanceVariables may also carry substantive
        and sentinel value domains directly (in profiles that introduce a RepresentedVariable
        - e.g., CDIFDataStructureProfile - these properties live on the RepresentedVariable
        instead and are disallowed here).
      properties:
        'cdi:takesSentinelValuesFrom':
          type: array
          items:
            anyOf:
            - '$ref': '../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifValueDomain/schema.yaml#/$defs/SentinelValueDomain'
            - type: object
              required:
              - '@id'
              additionalProperties: false
              properties:
                '@id':
                  type: string
          description: >-
            Sentinel (missing / not-applicable) value domain(s) for this variable (RepresentedVariable.takesSentinelValuesFrom).
        'cdi:takesSubstantiveValuesFrom':
          anyOf:
          - '$ref': '../../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifValueDomain/schema.yaml#/$defs/SubstantiveValueDomain'
          - type: object
            required:
            - '@id'
            additionalProperties: false
            properties:
              '@id':
                type: string
          description: >-
            The substantive value domain for this variable - the set of valid, meaningful
            values (RepresentedVariable.takesSubstantiveValuesFrom).
      allOf:
      - type: object
        description: >-
          All variableMeasured items at data description level must have an @id and cdif:physicalDataType
          so physical mappings can reference them.
        properties:
          '@id':
            type: string
            description: >-
              URI identifier for this variable, used as the target of cdif:formats_InstanceVariable
              references in physical mappings.
        required:
        - '@id'
