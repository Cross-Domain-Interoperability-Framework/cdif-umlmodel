'$schema': 'https://json-schema.org/draft/2020-12/schema'
title: CDIF Data Structure metadata profile
description: >-
  CDIF Data Structure profile. Extends the Data Description profile with full DDI-CDI structural
  complexity: composing cdifDataStructure (DataStructure + Dimensional/Long/Wide variants),
  cdifDataStructureComponent (component subclasses), cdifRepresentedVariable, and cdifValueDomain.
  Distributions are expected to carry cdi:isStructuredBy pointing at a Data Structure node.
type: object
allOf:
- '$ref': >-
    ../../../../../../../../metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifCore/schema.yaml
- '$ref': >-
    ../../../../../../../../metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDiscovery/schema.yaml
- '$ref': >-
    ../../../../../../../../metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataDescription/schema.yaml
- '$ref': >-
    ../../../../../../../../metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml
