'$schema': 'https://json-schema.org/draft/2020-12/schema'
title: CDIF Instance Variable
type: object
properties:
  '@type':
    type: array
    description: >-
      Must include both schema:PropertyValue and cdi:InstanceVariable. Additional types may
      be included.
    items:
      type: string
    contains:
      const: 'cdi:InstanceVariable'
  'cdif:physicalDataType':
    '$ref': >-
      ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
    description: identifier or name for the data type concept.
  'cdif:role':
    type: string
    enum:
    - UnitIdentifier
    - Measure
    - Attribute
    - Dimension
    - Descriptor
    - ReferenceVariable
    description: >-
      Specifies the role this variable plays in a data structure. UnitIdentifier names the
      unit a row describes; Measure holds observed/derived values; Attribute qualifies an
      observation; Dimension addresses a cell in a multi-dimensional cube; Descriptor names
      the variable that a Reference column records values for (long format); ReferenceVariable
      holds those recorded values.
  'cdif:simpleUnitOfMeasure':
    type: string
    description: >-
      The unit in which the data values are measured (kg, pound, euro), expressed as a simple
      string, in cases where no additional information is available (in the legacy system)
      or needed (as in the case of broad agreement within the community of use [i.e., ISO
      country codes, currencies, etc. in SDMX])
  'cdif:uses':
    type: array
    items:
      '$ref': >-
        ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
    description: >-
      Essentially the same as schema:propertyID. References the concept(s) this variable measures
      or represents -- and nothing else. A RepresentedVariable is NOT a legal value: that
      link is cdif:isDefinedBy_RepresentedVariable, which is reference-only and carries the
      no-duplication rule. The RepresentedVariable branch was removed 2026-09-25. It never
      widened what could be *written*, because cdifConceptOrTerm's first branch is already
      a sealed {@id} reference, so it only ever admitted an inline RepresentedVariable node
      -- which framing produced and nothing authored. Keeping it cost the property its single
      value type, made it a partial exception to the CDIF convention of disambiguating polymorphic
      DDI-CDI role names by target, and left it not type-compatible with canonical cdi:uses,
      which is valued by a Concept. The RepresentedVariable branch is not new behaviour: it
      is what the rest of CDIF already documents and enforces. description.md calls cdif:uses
      "concepts (or, under the Data Structure profile, the RepresentedVariable)"; agents.md
      describes the InstanceVariable as "a pointer (via cdif:uses) into a richer RepresentedVariable";
      the six NoDuplicate*Shape rules in cdifDataStructure traverse cdif:uses to reach that
      RepresentedVariable; and RepresentedVariableMustBeInstantiatedShape requires the link
      to exist. Only this schema said Concepts-only, and it was the outlier -- documents conforming
      to those rules could not be expressed here. A bare {@id} always matched via cdifConceptOrTerm;
      the branch is needed for the embedded form, because framing inlines a node whose @id
      is defined in the same document. cdif:isDefinedBy_RepresentedVariable remains the way
      to say that this InstanceVariable DEFERS its represented-variable-level properties to
      that RepresentedVariable; it is reference-only and carries the exclusivity rule. The
      cost is that cdif:uses no longer has a single value type, so it is a partial exception
      to the CDIF convention of disambiguating polymorphic DDI-CDI role names by target, and
      no longer strictly type-compatible with canonical cdi:uses, which is valued by a Concept.
  'cdif:isDefinedBy_RepresentedVariable':
    '$ref': >-
      ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/objectReference/schema.yaml
    description: >-
      The RepresentedVariable this InstanceVariable instantiates. A reference only (@id, nothing
      else): the point of the link is that the represented-variable-level properties are defined
      once on the RepresentedVariable and NOT duplicated here, so an inline copy would defeat
      it. The equivalent link within a data structure is cdif:isDefinedBy_Variable on cdifDataStructureComponent
      -- a different name because it means something wider: it accepts an InstanceVariable
      as well (in DDI-CDI an InstanceVariable IS a RepresentedVariable), and accepts one inline,
      because a structure may define a variable that exists nowhere else. This property stays
      narrow: the RepresentedVariable an InstanceVariable instantiates, by reference.
  'cdif:function':
    type: array
    items:
      '$ref': >-
        ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
    description: >-
      Immutable characteristic of the variable such as geographic designator, weight, temporal
      designation, etc. (InstanceVariable.function).
  'cdif:platformType':
    '$ref': >-
      ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
    description: >-
      The application or technical system context in which the variable has been realized
      - typically a statistical processing package or processing environment (InstanceVariable.platformType).
  'cdif:source':
    anyOf:
    - type: string
    - type: object
      additionalProperties: false
      required:
      - '@id'
      properties:
        '@id':
          type: string
    description: >-
      Reference capturing provenance information for this InstanceVariable (InstanceVariable.source).
  'cdif:isDescribedBy_StatisticsCollection':
    anyOf:
    - '$ref': '../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifStatistics/schema.yaml#/$defs/StatisticsCollection'
    - type: object
      required:
      - '@id'
      additionalProperties: false
      properties:
        '@id':
          type: string
    description: >-
      The StatisticsCollection holding summary / category statistics for this InstanceVariable
      (direct JSON mapping of the DDI-CDI `InstanceVariable.isDescribedBy → StatisticsCollection`
      association). cdif: namespaced and target-suffixed because the DDI-CDI isDescribedBy
      association is polymorphic. This is the canonical CDIF path for **per-variable** statistics;
      dataset-scope aggregates (row count etc.) go under `Dataset.cdif:statistics` instead.
  'cdif:describedUnitOfMeasure':
    '$ref': >-
      ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTerm/schema.yaml
    description: >-
      The unit in which the data values are measured, expressed as a controlled-vocabulary
      entry (RepresentedVariable.describedUnitOfMeasure). For a plain-string unit, use cdif:simpleUnitOfMeasure
      instead.
  'cdif:qualifies':
    type: object
    required:
    - '@id'
    additionalProperties: false
    properties:
      '@id':
        type: string
    description: reference to an instance variable defined for this dataset
required:
- '@type'
allOf:
- '$ref': >-
    ../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/variableMeasured/schema.yaml
- if:
    required:
    - 'cdif:isDefinedBy_RepresentedVariable'
  then:
    properties:
      'cdi:takesSubstantiveValuesFrom': false
      'cdi:takesSentinelValuesFrom': false
      'cdif:hasIntendedDataType': false
      'cdif:describedUnitOfMeasure': false
      'cdif:unitOfMeasureKind': false
      'cdi:measures': false
      'cdif:externalDefinition': false
      'cdif:uses_Concept': false
      'cdif:definition': false
    description: >-
      When cdif:isDefinedBy_RepresentedVariable is present, the represented-variable-level
      properties live on that RepresentedVariable and may not be declared inline on the InstanceVariable.
