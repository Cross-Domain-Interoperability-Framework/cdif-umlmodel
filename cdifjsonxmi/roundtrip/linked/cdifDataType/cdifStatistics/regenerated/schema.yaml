'$schema': 'https://json-schema.org/draft/2020-12/schema'
title: CDIF Statistics
description: >-
  CDIF profile of the DDI-CDI Statistics / CategoryStatistics / StatisticsCollection classes
  (2026-03 model). A Statistics node carries one or more Statistic value objects; CategoryStatistics
  carries per-category results; a StatisticsCollection groups Statistics nodes. The root validates
  any of the three. CDIF divergences from canonical DDI-CDI: properties valued by InternationalString
  / LabelForDisplay / ObjectName are simplified to plain strings and carried under the cdif:
  namespace (cdif:name, cdif:descriptiveText, cdif:definition, cdif:displayLabel); the polymorphic
  cdi:has association is split into target-specific cdif:has_* keys; cdif:appliesTo and cdif:indexedBy
  are CDIF additions (not present in the canonical model) that link statistics to the InstanceVariable(s)
  they describe.
type: object
anyOf:
- '$ref': '#/$defs/Statistics'
- '$ref': '#/$defs/CategoryStatistics'
- '$ref': '#/$defs/StatisticsCollection'
'$defs':
  Category:
    type: object
    title: Category
    description: >-
      Minimal Category shape used as a CategoryStatistics target. CDIF simplifies the DDI-CDI
      InternationalString / LabelForDisplay / ObjectName valued properties to plain strings
      carried under the cdif: namespace. A full CDIF treatment of categories lives in cdifEnumerationDomain
      / SKOS Concept.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'cdi:Category'
        minItems: 1
      '@id':
        type: string
      'cdif:name':
        '$ref': '#/$defs/StringOrStringList'
        description: >-
          Human-understandable name(s). CDIF-simplified from DDI-CDI Category.name (ObjectName)
          to plain strings.
      'cdif:descriptiveText':
        type: string
        description: >-
          Short natural-language account of the category. CDIF-simplified from DDI-CDI Category.descriptiveText
          (InternationalString).
      'cdif:definition':
        type: string
        description: >-
          Natural-language definition of the category. CDIF-simplified from DDI-CDI Category.definition
          (InternationalString).
      'cdif:displayLabel':
        type: array
        items:
          type: string
        description: >-
          Human-readable display label(s). CDIF-simplified from DDI-CDI Category.displayLabel
          (LabelForDisplay).
  CategoryStatistics:
    type: object
    title: CategoryStatistics
    description: Statistics for a specific Category of an instance variable within a data
      set.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'cdi:CategoryStatistics'
        minItems: 1
      '@id':
        type: string
        description: Identifier for this CategoryStatistics node.
      'cdi:for':
        anyOf:
        - '$ref': '#/$defs/Category'
        - type: object
          required:
          - '@id'
          additionalProperties: false
          properties:
            '@id':
              type: string
        description: >-
          The Category this CategoryStatistics is for (inline Category node or an @id-reference).
      'cdif:typeOfStatistic':
        '$ref': >-
          ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
        description: Controlled-vocabulary entry naming the kind of statistic.
      'cdi:statistic':
        type: array
        items:
          '$ref': '#/$defs/CategoryStatisticsStatistic'
        minItems: 1
        description: Per-category Statistic value objects.
      'cdi:hasWeight':
        anyOf:
        - '$ref': >-
            ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifInstanceVariable/schema.yaml
        - type: object
          required:
          - '@id'
          additionalProperties: false
          properties:
            '@id':
              type: string
        description: >-
          The InstanceVariable whose values were used as weights (inline cdifInstanceVariable
          node or an @id-reference).
    required:
    - '@type'
    - 'cdi:for'
    - 'cdi:statistic'
  CategoryStatisticsStatistic:
    type: object
    title: Statistic
    description: >-
      DDI-CDI Statistic dataType — a single computed value (mean, count, median, etc.). A
      value object with no identity; appears inline inside a cdi:statistic array.
    properties:
      'cdi:computationBase':
        type: string
        enum:
        - MissingOnly
        - Total
        - ValidOnly
        description: >-
          The cases included in determining the statistic — Total (all cases, valid and missing),
          ValidOnly (valid values only), MissingOnly (invalid cases only).
      'cdi:content':
        type: number
        description: The value of the statistic expressed as a real number.
      'cdi:isWeighted':
        default: false
        type: boolean
        description: True if the statistic was computed using a weighting variable.
      'cdi:typeOfNumericValue':
        type: string
        description: The type of numeric value carried in cdi:content — decimal, float, or
          double.
  Statistics:
    type: object
    title: Statistics
    description: >-
      A named bundle of one or more Statistic value objects for an instance variable, optionally
      weighted, optionally broken down by Category.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'cdi:Statistics'
        minItems: 1
      '@id':
        type: string
        description: Identifier for this Statistics node.
      'cdif:typeOfStatistic':
        '$ref': >-
          ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
        description: >-
          Controlled-vocabulary entry naming the kind of statistic — e.g. mean, median, count,
          sum, stdDev.
      'cdi:statistic':
        type: array
        items:
          '$ref': '#/$defs/StatisticsStatistic'
        minItems: 1
        description: >-
          Ordered list of Statistic value objects carried by this bundle. Order is significant
          — consumers MAY rely on array position.
      'cdi:hasWeight':
        anyOf:
        - '$ref': >-
            ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifInstanceVariable/schema.yaml
        - type: object
          required:
          - '@id'
          additionalProperties: false
          properties:
            '@id':
              type: string
        description: >-
          The InstanceVariable whose values were used as weights when computing the Statistic
          entries (inline cdifInstanceVariable node or an @id-reference).
      'cdif:appliesTo':
        type: array
        items:
          anyOf:
          - '$ref': >-
              ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifInstanceVariable/schema.yaml
          - type: object
            required:
            - '@id'
            additionalProperties: false
            properties:
              '@id':
                type: string
        minItems: 1
        description: >-
          CDIF addition (not in canonical DDI-CDI): the InstanceVariable(s) this Statistics
          bundle summarizes — the per-bundle "what these numbers describe" link. Used **only**
          when this Statistics bundle sits inside a StatisticsCollection that indexes more
          than one variable, to disambiguate which variable each bundle describes. It MUST
          NOT appear on a Statistics bundle attached at Dataset level via `cdif:statistics`;
          per-variable stats belong under `schema:variableMeasured[i].cdif:isDescribedBy_StatisticsCollection`
          (the direct JSON mapping of the DDI-CDI `InstanceVariable.isDescribedBy` association).
      'cdif:has_CategoryStatistics':
        type: array
        items:
          '$ref': '#/$defs/CategoryStatistics'
        description: >-
          CategoryStatistics entries breaking this Statistics bundle down by Category. cdif:
          namespaced and target-suffixed because the DDI-CDI cdi:has association is polymorphic.
    required:
    - '@type'
    - 'cdi:statistic'
  StatisticsCollection:
    type: object
    title: StatisticsCollection
    description: >-
      Groups one or more Statistics nodes for an instance variable. A typical use is a dataset-level
      collection holding row-count / mean / stddev Statistics for each measured variable.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'cdi:StatisticsCollection'
        minItems: 1
      '@id':
        type: string
        description: Identifier for this StatisticsCollection node.
      'cdi:hasWeight':
        anyOf:
        - '$ref': >-
            ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifInstanceVariable/schema.yaml
        - type: object
          required:
          - '@id'
          additionalProperties: false
          properties:
            '@id':
              type: string
        description: >-
          The InstanceVariable whose values were used as weights (inline cdifInstanceVariable
          node or an @id-reference).
      'cdif:has_Statistics':
        type: array
        items:
          anyOf:
          - '$ref': '#/$defs/Statistics'
          - type: object
            required:
            - '@id'
            additionalProperties: false
            properties:
              '@id':
                type: string
        minItems: 1
        description: >-
          Statistics nodes carried by this collection (inline or @id-ref). cdif: namespaced
          and target-suffixed because the DDI-CDI cdi:has association is polymorphic.
      'cdif:indexedBy':
        type: array
        items:
          anyOf:
          - '$ref': >-
              ../../../../../../../metadataBuildingBlocks/_sources/cdifDataType/cdifInstanceVariable/schema.yaml
          - type: object
            required:
            - '@id'
            additionalProperties: false
            properties:
              '@id':
                type: string
        minItems: 1
        description: >-
          CDIF addition (not in canonical DDI-CDI): the InstanceVariable(s) the contained
          Statistics index — the collection-level coordinate space. Marks the collection as
          per-variable-scoped: a StatisticsCollection carrying `cdif:indexedBy` MUST be attached
          via `schema:variableMeasured[i].cdif:isDescribedBy_StatisticsCollection` on one
          of the indexed variables, NOT at Dataset level via `cdif:statistics` (which is reserved
          for genuinely dataset-scope aggregates like row count).
    required:
    - '@type'
    - 'cdif:has_Statistics'
  StatisticsStatistic:
    type: object
    title: Statistic
    description: >-
      DDI-CDI Statistic dataType — a single computed value (mean, count, median, etc.). A
      value object with no identity; appears inline inside a cdi:statistic array.
    properties:
      'cdi:computationBase':
        type: string
        enum:
        - MissingOnly
        - Total
        - ValidOnly
        description: >-
          The cases included in determining the statistic — Total (all cases, valid and missing),
          ValidOnly (valid values only), MissingOnly (invalid cases only).
      'cdi:content':
        type: number
        description: The value of the statistic expressed as a real number.
      'cdi:isWeighted':
        default: false
        type: boolean
        description: True if the statistic was computed using a weighting variable.
      'cdi:typeOfNumericValue':
        type: string
        description: The type of numeric value carried in cdi:content — decimal, float, or
          double.
  StringOrStringList:
    anyOf:
    - type: string
    - type: array
      items:
        type: string
      minItems: 1
