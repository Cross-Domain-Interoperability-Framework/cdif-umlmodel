'$schema': 'https://json-schema.org/draft/2020-12/schema'
title: CDIF Provenance Activity
description: >-
  Extended provenance activity building block for CDIF. Extends the minimal prov:Activity
  (generatedBy) with schema.org Action properties for comprehensive provenance documentation
  including agents, instruments, methodology, temporal bounds, action chaining, and more.
type: object
allOf:
- '$ref': >-
    ../../../../../../../metadataBuildingBlocks/_sources/provProperties/generatedBy/schema.yaml
- type: object
  properties:
    '@type':
      type: array
      items:
        type: string
      minItems: 2
      contains:
        const: 'schema:Action'
      description: >-
        Must include both schema:Action and prov:Activity (prov:Activity required by base
        generatedBy schema)
    'prov:used':
      type: array
      items:
        if:
          type: object
          required:
          - 'schema:instrument'
        then:
          properties:
            'schema:instrument':
              type: array
              minItems: 1
              items:
                '$ref': >-
                  ../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/instrument/schema.yaml
      description: >-
        Base generatedBy defines the allowed item shapes (string | {@id} | inline prov:Entity
        | a role-keyed wrapper naming schema:instrument / bios:computationalTool / prov:reagent).
        This profile only PINS the schema:instrument wrapper's value to the Instrument description
        when that key is present; it adds no other restriction, so all base item shapes (including
        inline prov:Entity inputs such as samples) remain valid. The wrapped value is an ARRAY
        of Instrument. schema:instrument is 0..* -- one activity commonly uses several instruments
        in the same role (a laser ablation cell plus the ICP-MS it feeds) -- and this schema
        implements every 1..* / 0..* property as a JSON array, never as "object or array",
        so a consumer never has to test the value's type before iterating.
    'schema:name':
      type: string
      description: Human-readable name for the activity
    'schema:description':
      type: string
      description: Text description of what this activity did
    'schema:identifier':
      anyOf:
      - '$ref': >-
          ../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/identifier/schema.yaml
      - type: string
      description: Formal identifier for this activity
    'schema:agent':
      anyOf:
      - '$ref': '#/$defs/PersonOrOrganizationOrAgentInRole'
      - type: object
        required:
        - '@id'
        additionalProperties: false
        properties:
          '@id':
            type: string
            description: reference to an agent defined elsewhere
      description: Primary responsible agent for this activity (maps to PROV wasAssociatedWith)
    'schema:participant':
      type: array
      items:
        anyOf:
        - '$ref': '#/$defs/PersonOrOrganizationOrAgentInRole'
        - type: object
          required:
          - '@id'
          additionalProperties: false
          properties:
            '@id':
              type: string
              description: reference to a participant defined elsewhere
      description: Other participants in this activity
    'schema:object':
      '$ref': '#/$defs/ProvActivityObjectChoice'
      description: >-
        Input entity (or entities) for this activity. Per schema.org, the range of schema:object
        is schema:Thing. Accepts four shapes (1) a string URI, (2) an @id reference object,
        (3) an inline schema:Thing object, or (4) an array whose items take any of those shapes
        (used when an activity has multiple inputs, e.g. samples analyzed). Supports action
        chaining where the value references the result of a prior activity.
    'schema:result':
      anyOf:
      - type: string
      - type: object
        required:
        - '@id'
        additionalProperties: false
        properties:
          '@id':
            type: string
            description: reference to an output entity
      - '$ref': '#/$defs/ProvActivityObject'
        description: Inline schema:Thing object describing the output entity.
      - type: array
        items:
          '$ref': '#/$defs/StringOrObject'
        description: >-
          Multiple output entities. Each item may be a string URI, an @id reference, or an
          inline schema:Thing.
      description: >-
        Output entity (or entities) produced by this activity. Per schema.org, the range is
        schema:Thing. Accepts: (1) a string URI reference (action chaining shorthand to be
        referenced as schema:object of a subsequent activity); (2) a single {"@id": "<uri>"}
        object reference; (3) an inline schema:Thing (object with @type); or (4) an array
        of any of these forms (e.g. multiple datasets produced by this activity). Profiles
        may restrict the array item shape further.
    'schema:actionStatus':
      type: string
      enum:
      - 'schema:CompletedActionStatus'
      - 'schema:ActiveActionStatus'
      - 'schema:PotentialActionStatus'
      - 'schema:FailedActionStatus'
      description: Status of this activity
    'schema:startTime':
      type: string
      description: ISO8601 date-time when the activity started (maps to PROV startedAtTime)
    'schema:endTime':
      type: string
      description: ISO8601 date-time when the activity ended (maps to PROV endedAtTime)
    'schema:location':
      anyOf:
      - '$ref': >-
          ../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/spatialExtent/schema.yaml
      - type: string
      - type: object
        required:
        - '@id'
        additionalProperties: false
        properties:
          '@id':
            type: string
            description: reference to a place defined elsewhere
      description: Where the activity occurred
    'schema:actionProcess':
      anyOf:
      - '$ref': '#/$defs/ProvActivityHowTo'
      - type: string
      - type: object
        required:
        - '@id'
        additionalProperties: false
        properties:
          '@id':
            type: string
            description: reference to a methodology defined elsewhere
      description: Methodology or protocol for this activity
    'schema:error':
      type: string
      description: Error description for failed activities
    'schema:additionalProperty':
      type: array
      items:
        '$ref': >-
          ../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/additionalProperty/schema.yaml
      description: Domain-specific extension properties
'$defs':
  PersonOrOrganizationOrAgentInRole:
    anyOf:
    - '$ref': >-
        ../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/person/schema.yaml
    - '$ref': >-
        ../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/organization/schema.yaml
    - '$ref': >-
        ../../../../../../../metadataBuildingBlocks/_sources/schemaorgProperties/agentInRole/schema.yaml
  ProvActivityHowTo:
    type: object
    description: A methodology or protocol described as a HowTo with optional steps
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'schema:HowTo'
        minItems: 1
      '@id':
        type: string
      'schema:step':
        type: array
        items:
          '$ref': '#/$defs/ProvActivityHowToStep'
        description: Ordered steps in this methodology
      'schema:name':
        type: string
        description: Name of the methodology or protocol
      'schema:description':
        type: string
        description: Description of the methodology
      'schema:url':
        type: string
        format: uri
        description: URL to a published methodology or protocol document
    required:
    - '@type'
    allOf:
    - anyOf:
      - required:
        - 'schema:name'
      - required:
        - 'schema:url'
  ProvActivityHowToStep:
    type: object
    description: A single step in a HowTo methodology
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'schema:HowToStep'
        minItems: 1
      'schema:name':
        type: string
        description: Name of this step
      'schema:description':
        type: string
        description: Description of what this step involves
      'schema:url':
        type: string
        format: uri
        description: URL to documentation for this step
      'schema:position':
        type: integer
        description: Ordinal position of this step
    required:
    - '@type'
    - 'schema:name'
  ProvActivityObject:
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        minItems: 1
    required:
    - '@type'
  ProvActivityObjectChoice:
    anyOf:
    - type: string
    - type: object
      required:
      - '@id'
      additionalProperties: false
      properties:
        '@id':
          type: string
          description: reference to an input entity
    - '$ref': '#/$defs/ProvActivityObject'
      description: Inline schema:Thing object describing the input entity.
    - type: array
      items:
        '$ref': '#/$defs/StringOrObject'
      description: >-
        Multiple input entities (e.g. samples analyzed). Each item may be a string URI, an
        @id reference, or an inline schema:Thing.
  ProvActivityObjectChoiceChoiceListObject:
    type: object
  StringOrObject:
    anyOf:
    - type: string
    - '$ref': '#/$defs/ProvActivityObjectChoiceChoiceListObject'
